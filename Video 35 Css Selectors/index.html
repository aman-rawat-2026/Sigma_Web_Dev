<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More on CSS Selectors</title>
    <style>
      /* .box:first-child{
            background-color: red;    
        } */
      /* .box::first-line{
            color:yellow;
         } */
      /* .boxex *{
            color:blue;

          } */
           /* [data-color="Primary"]{
            padding-top: 45px;
           } */
      /* .box:nth-child(even) {
        background-color: blue;
      } */
       .boxes::before{
        content:"Good";
        color:green;
       }
       .boxes::after{
        content:"Bad";
        color:red;
       }
       ::selection{
        background-color:black;
        color:aqua;
       }
       .box::first-letter{
        color:peru; 
       }
    </style>
  </head>
  <body>
    <div class="boxes">
      <div data-color="Primary" class="box">I'm a box</div>
      <div class="box">Hey I'm a box.</div>
      <div class="box">Hey I'm a box.</div>
    </div>
  </body>
</html>
