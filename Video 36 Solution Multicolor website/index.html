<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Multicolor website</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Imperial+Script&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    </style>

    <style>
      :root {
        --primary-color: rgb(101, 86, 236);
        --text-color: white;
        --secondary-color: rgb(37, 22, 122);
      }
      * {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: var(--primary-color);
      }

      nav {
        background-color: var(--secondary-color);
        padding: 12px 0px;
      }
      ul li {
        list-style: none;
        padding: 23px;
        display: inline;
        /* font-weight: bold; */

        text-transform: uppercase;
      }
      ul li a {
        color: var(--text-color);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="https://www.google.com/" target="_blank">Google</a></li>
          <li>
            <a href="https://www.youtube.com/" target="_blank">Youtube</a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank">Instagram</a>
          </li>
          <li>
            <a href="https://www.whatsapp.com/" target="_blank">Whatsapp</a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
