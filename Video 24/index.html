<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>
    <style>
        .box{
            border: 2px solid black ;
            padding: 34px;
            box-shadow: 5px 15px 5px #439b09;
        }
        
        .text-element{
            text-shadow: 5px 5px 4px #cc5a38;
        }
    </style>


</head>
<body>
    <div class="box">I'm a box</div> 
    <p class="text-element">Lorem ipsum dolor sit amet, consectetur adipisicing elit. At delectus amet ratione! Deleniti reprehenderit nisi perspiciatis reiciendis voluptatum magnam quam soluta ea eum./p>



</body>
</html>
