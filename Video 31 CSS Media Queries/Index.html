<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>
    <style>
        body{
            background-color: red;
        }

        @media screen and (orientation: landscape) {
            body{
                border: 2px solid purple;
            }

        }

        
        @media only screen and (max-width: 455px){ body{ background-color: rgb(30, 15, 168);} .boxes{ flex-direction: column;}}
        .boxes{
            display: flex;
            justify-content: center;   
            align-items: center;
            height: 100vh;

        }
        
        
        .box{
            width: 344px;
            border-radius: 24px;
            height: 344px;
            padding: 3px;
            margin: 3px;
            background-color: steelblue;
        }
    </style>
</head>
<body> 
    <div>
        I'm a red body guy!
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    
</html>
