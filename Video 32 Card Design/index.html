<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Design</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: gray;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #cardWrapper {
        background-color: white;
        border: 2px solid gray;
        height: 370px;
        width: 244px;
        border-radius: 10px;
      }
      #imageOfBoat img {
        height: 154px;
        border-radius: 7px;
        padding: 5px 7px 3px 6px;
      }
      #content p {
        text-align: justify;
        color: gray;
        padding: 1px 5px;
      }
      #content h2 {
        padding: 2px 5px;
      }

      #capsules {
        padding: 2px 5px;
      }
      #capsules span {
        border: 1px solid gray;
        border-radius: 14px;
        padding: 0px 7px;
      }
      #readMoreButton {
        text-align: center;
      }
      #readMoreButton button{
        border-radius: 14px;
        padding: 5px 7px;
        background-color: rgb(118, 220, 252);
        color: rgb(14, 116, 184);
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="cardWrapper">
      <div id="imageOfBoat">
        <img
          src="https://imgs.search.brave.com/uc6zExu1BVGD_mVIagHnjaApVTEHz1QOVK6A_tfHY8g/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tZWRp/YS5pc3RvY2twaG90/by5jb20vaWQvODk4/Njk5NjcwL3Bob3Rv/L2J1c2luZXNzLW1h/bi1vbi1hLWJvYXQt/d2F0Y2hpbmctdGhl/LWZ1dHVyZS13aXRo/LWEtc3B5Z2xhc3Mu/anBnP3M9NjEyeDYx/MiZ3PTAmaz0yMCZj/PTl4NE1nWW5rUjFn/UTFRX3dNVTVXckV0/OGctdUQtNzdkb0N5/XzZiUmFZMGc9"
        />
      </div>
      <div id="capsules">
        <span>Nature</span>
        <span>Lake</span>
      </div>
      <div id="content">
        <h2>Aman</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Placeat
          tenetur minus cum iure, eos hic unde provident ut quasi sapiente!
          Pariatur tempore itaque illum ducimus.
        </p>
      </div>
      <div id="readMoreButton">
        <button>Read More</button>
      </div>
    </div>
    
  </body>
</html>
